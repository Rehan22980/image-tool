async function callAI() {
  const prov = AI_PROVIDERS[ai.settings.provider] || AI_PROVIDERS.custom;
  const recent = ai.messages.slice(-10);
  const lastUser = recent.findLast((m) => m.role === "user");
  const sendImages = !!(prov.vision && lastUser?.images?.length);
  const msgs = [
    { role: "system", content: AI_SYSTEM_PROMPT + "\n\n" + projectContext(prov.vision) },
    ...recent.map((m) => {
      let text = m.note ? `${m.content}\n[${m.note}]` : m.content;
      if (m.images?.length) text += `\n[Attached: ${m.images.join(", ")}]`;
      if (m === lastUser && sendImages) {
        return { role: "user", content: [{ type: "text", text }, ...m.images.map((id) => ({ type: "image_url", image_url: { url: ai.images[id].visionSrc } }))] };
      }
      return { role: m.role, content: text };
    }),
  ];
  const model = sendImages && prov.visionModel ? prov.visionModel : ai.settings.model;
  let raw = await llm(msgs, model);
  let data = parseAIJson(raw);
  if (!data) {
    msgs.push({ role: "assistant", content: raw }, { role: "user", content: "That was not valid JSON. Reply again with only the JSON object described in the instructions." });
    raw = await llm(msgs, model);
    data = parseAIJson(raw);
  }
  return data || { reply: raw.trim(), action: "none" };
}

// Free services limit how often you can ask. When they say "retry after N seconds", wait and try again.
async function llm(messages, model, attempt = 0) {
  try {
    return await llmOnce(messages, model);
  } catch (err) {
    const wait = err.retryAfter;
    if (!wait || attempt >= 2 || wait > 90) throw err;
    setTyping(`Free AI limit — waiting ${wait} seconds`);
    await sleep(wait * 1000);
    setTyping("AI is working");
    return llm(messages, model, attempt + 1);
  }
}

function setTyping(text) {
  ai.status = text;
  renderChat();
}

async function llmOnce(messages, model) {
  const s = ai.settings;
  if (!s.url) throw new Error("Add the API URL in AI settings first.");
  const headers = { "Content-Type": "application/json" };
  if (s.key) headers.Authorization = "Bearer " + s.key;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try {
    res = await fetch(s.url, { method: "POST", headers, signal: ctrl.signal, body: JSON.stringify({ model, messages, temperature: 0.7 }) });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "The AI took too long to answer. Please try again." : "Couldn't reach the AI service. Check your internet connection and the API URL in AI settings.");
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) {
    const body = await res.text();
    if (res.status === 401 || res.status === 403) throw new Error("The AI service refused the API key. Check the key in AI settings.");
    if (res.status === 402 || res.status === 429) {
      const err = new Error("The free AI service is busy (too many requests). Wait a minute and try again, or add a free key in AI settings.");
      const m = body.match(/retry after (\d+)/i) || [null, res.headers.get("retry-after")];
      err.retryAfter = Math.ceil(+m[1] || 45) + 1;
      throw err;
    }
    if (/image/i.test(body) && /support/i.test(body)) throw new Error("This AI model can't read pictures. In AI settings choose Google Gemini or Groq (free keys) to read images.");
    throw new Error(`AI service error ${res.status}: ${body.slice(0, 200)}`);
  }
  const content = (await res.json()).choices?.[0]?.message?.content;
  if (!content) throw new Error("The AI returned an empty answer. Please try again.");
  return content;
}

function parseAIJson(raw) {
  const text = String(raw).replace(/```(?:json)?/gi, "");
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start < 0 || end <= start) return null;
  try {
    const d = JSON.parse(text.slice(start, end + 1));
    return d && typeof d === "object" ? d : null;
  } catch (e) {
    return null;
  }
}

async function applyAI(d) {
  const slides = (Array.isArray(d.slides) ? d.slides : []).filter((x) => x && typeof x === "object");
  const c = d.course && typeof d.course === "object" ? d.course : null;
  const setCourse = () => {
    if (!c) return;
    for (const k of ["title", "description", "category", "level"]) if (typeof c[k] === "string" && c[k].trim()) project[k] = c[k].trim();
    if (Array.isArray(c.tags) && c.tags.length) project.tags = c.tags.map(String).slice(0, 10);
  };
  const setLook = () => {
    if (AI_THEMES[d.theme]) project.aiTheme = d.theme;
    if (AI_STYLES[d.style]) project.aiStyle = d.style;
  };
  let note;
  let made = [];

  if (d.action === "new_presentation" && slides.length) {
    setCourse();
    setLook();
    made = slides.map((sl, i) => buildSlide(sl, project.aiTheme, project.aiStyle, i));
    project.pages = made;
    pageIndex = 0;
    note = `Created ${made.length} slides (${AI_THEMES[project.aiTheme || "blue"].name} · ${AI_STYLES[project.aiStyle || "modern"]}) — press Undo to go back`;
  } else if (d.action === "add_slides" && slides.length) {
    made = slides.map((sl, i) => buildSlide(sl, project.aiTheme, project.aiStyle, pageIndex + i));
    project.pages.splice(pageIndex + 1, 0, ...made);
    pageIndex += 1;
    note = `Added ${made.length} slide(s)`;
  } else if (d.action === "replace_current" && slides.length) {
    made = [buildSlide(slides[0], project.aiTheme, project.aiStyle, curPage().variant || 0)];
    project.pages[pageIndex] = made[0];
    note = "Updated this slide — press Undo to go back";
  } else if (d.action === "update_course" && c) {
    setCourse();
    note = "Updated course details";
  } else if (d.action === "restyle" && (AI_THEMES[d.theme] || AI_STYLES[d.style])) {
    setLook();
    const n = restyleAll();
    note = `Restyled ${n} slide(s) — ${AI_THEMES[project.aiTheme || "blue"].name} · ${AI_STYLES[project.aiStyle || "modern"]}`;
  } else {
    return "";
  }

  fillContents();
  selectedId = null;
  renderAll();
  commit();
  if (ai.settings.images && made.some((p) => p.pendingImage)) fillImages(made.map((p) => p.id));
  return note;
}

// Rebuild a designed page from its saved content with the current theme/style (or another layout variation).
function rebuildPage(p, variant) {
  const np = buildSlide(p.spec, project.aiTheme, project.aiStyle, variant);
  Object.assign(np, { id: p.id, name: p.name, tags: p.tags, notes: p.notes });
  return np;
}

function restyleAll() {
  let n = 0;
  project.pages = project.pages.map((p) => (p.spec ? (n++, rebuildPage(p, p.variant || 0)) : p));
  fillContents();
  return n;
}

// ---------- Layout builders ----------
function fitSize(text, w, maxH, base, min, family, bold, lineHeight) {
  let size = Math.round(base);
  for (; size > min; size--) {
    measureCtx.font = `${bold ? 700 : 400} ${size}px "${family}"`;
    if (wrapLines(measureCtx, text, w).length * size * lineHeight <= maxH) break;
  }
  return size;
}

function textHeight(el) {
  measureCtx.font = `${el.bold ? 700 : 400} ${el.fontSize}px "${el.fontFamily}"`;
  return wrapLines(measureCtx, el.text, el.w).length * el.fontSize * (el.lineHeight || 1.25);
}

// A text box that shrinks its font until the text fits [x, y, w, maxH].
// Urdu/Arabic text gets a Nastaliq font, taller lines and right alignment.
function aiText(text, [x, y, w, maxH], size, t, o = {}) {
  text = String(text ?? "").trim();
  if (!text) return null;
  const rtl = RTL.test(text);
  const family = rtl ? "Noto Nastaliq Urdu" : o.head ? t.head : t.body;
  const lineHeight = rtl ? 1.9 : o.lineHeight || 1.25;
  const base = rtl ? size * 0.8 : size;
  const fontSize = fitSize(text, w, maxH, base, Math.max(10, base * 0.45), family, o.bold, lineHeight);
  let align = o.align || "left";
  if (rtl && align === "left") align = "right";
  const el = T(text, x, y, w, { fontSize, fontFamily: family, lineHeight, color: o.color || t.text, bold: !!o.bold, italic: !!o.italic, align });
  if (o.middle) el.y = Math.round(y + (maxH - textHeight(el)) / 2); // centre vertically in the box
  return el;
}

const strList = (a, n = 8) => (Array.isArray(a) ? a : []).map((v) => String(v ?? "").trim()).filter(Boolean).slice(0, n);
const bulletText = (a, mark = "•") => strList(a).map((b) => `${mark} ${b}`).join("\n");

function centerRow(els, W) {
  const total = els.reduce((sum, e) => sum + e.w + 12, -12);
  let x = (W - total) / 2;
  for (const e of els) { e.x = Math.round(x); x += e.w + 12; }
  return els;
}

// Slide title in the chosen style; returns the box left for the slide's content.
function header(p, title, t, st, W, H, s) {
  const rtl = RTL.test(title || "");
  switch (st) {
    case "bold":
      p.elements.push(
        S("rect", 0, 0, W, H * 0.24, { fill: t.accent }),
        aiText(title, [W * 0.07, H * 0.04, W * 0.86, H * 0.16], 44 * s, t, { head: true, bold: true, color: t.onAccent, middle: true }),
      );
      return { x: W * 0.07, y: H * 0.32, w: W * 0.86, h: H * 0.6 };
    case "minimal":
      p.elements.push(
        aiText(title, [W * 0.07, H * 0.09, W * 0.86, H * 0.16], 40 * s, t, { head: true }),
        S("rect", W * 0.07, H * 0.27, W * 0.86, Math.max(1, 1.5 * s), { fill: t.muted, opacity: 0.35 }),
      );
      return { x: W * 0.07, y: H * 0.33, w: W * 0.86, h: H * 0.58 };
    case "playful":
      p.elements.push(
        S("ellipse", W - H * 0.32, -H * 0.18, H * 0.5, H * 0.5, { fill: t.soft }),
        S("ellipse", -H * 0.12, H * 0.82, H * 0.3, H * 0.3, { fill: t.soft }),
        S("ellipse", rtl ? W * 0.91 : W * 0.07, H * 0.13, 26 * s, 26 * s, { fill: t.accent }),
        aiText(title, [rtl ? W * 0.07 : W * 0.11, H * 0.08, W * 0.82, H * 0.18], 44 * s, t, { head: true, bold: true }),
      );
      return { x: W * 0.07, y: H * 0.32, w: W * 0.86, h: H * 0.6 };
    case "split":
      p.elements.push(
        S("rect", rtl ? W * 0.66 : 0, 0, W * 0.34, H, { fill: t.cover }),
        S("rect", rtl ? W * 0.69 : W * 0.04, H * 0.12, W * 0.05, Math.max(3, 6 * s), { fill: t.onCover, opacity: 0.6 }),
        aiText(title, [rtl ? W * 0.69 : W * 0.04, H * 0.18, W * 0.26, H * 0.64], 42 * s, t, { head: true, bold: true, color: t.onCover }),
      );
      return { x: rtl ? W * 0.05 : W * 0.4, y: H * 0.12, w: W * 0.55, h: H * 0.78 };
    default: // modern
      p.elements.push(
        aiText(title, [W * 0.07, H * 0.08, W * 0.86, H * 0.18], 44 * s, t, { head: true, bold: true }),
        S("rect", rtl ? W * 0.87 : W * 0.07, H * 0.27, W * 0.06, Math.max(3, 6 * s), { fill: t.accent, radius: 3 * s }),
      );
      return { x: W * 0.07, y: H * 0.34, w: W * 0.86, h: H * 0.58 };
  }
}

function cardsGrid(p, items, b, t, s, mark) {
  const n = Math.max(1, items.length), cols = n <= 3 ? n : n === 4 ? 2 : 3, rows = Math.ceil(n / cols);
  const g = 18 * s, pad = 22 * s, top = mark ? 44 * s : 22 * s;
  const cw = (b.w - (cols - 1) * g) / cols, ch = (b.h - (rows - 1) * g) / rows;
  items.forEach((text, i) => {
    const x = b.x + (i % cols) * (cw + g), y = b.y + Math.floor(i / cols) * (ch + g);
    p.elements.push(
      S("rect", x, y, cw, ch, { fill: t.soft, radius: 16 * s }),
      mark ? T(mark, x + pad, y + pad * 0.8, 40 * s, { fontSize: 24 * s, fontFamily: "Segoe UI Emoji" })
        : S("rect", x + pad, y + pad, 36 * s, Math.max(3, 5 * s), { fill: t.accent, radius: 3 * s }),
      aiText(text, [x + pad, y + pad + top, cw - 2 * pad, ch - 2 * pad - top], 26 * s, t, { lineHeight: 1.4 }),
    );
  });
}

// Numbered rows: [{title?, text}]
function numberedRows(p, rows, b, t, s) {
  const n = Math.max(1, rows.length), rh = b.h / n, dia = Math.min(rh * 0.62, 52 * s);
  rows.forEach((r, i) => {
    const y = b.y + i * rh;
    const rtl = RTL.test((r.title || "") + (r.text || ""));
    const cx = rtl ? b.x + b.w - dia : b.x, tx = rtl ? b.x : b.x + dia + 22 * s, tw = b.w - dia - 22 * s;
    const num = dia * 0.45;
    p.elements.push(
      S("ellipse", cx, y + (rh - dia) / 2, dia, dia, { fill: t.accent }),
      T(String(i + 1), cx, y + rh / 2 - num * 0.625, dia, { fontSize: num, bold: true, color: t.onAccent, align: "center" }),
    );
    if (r.title) {
      p.elements.push(
        aiText(r.title, [tx, y + rh * 0.08, tw, rh * 0.4], 26 * s, t, { bold: true }),
        aiText(r.text, [tx, y + rh * 0.5, tw, rh * 0.44], 20 * s, t, { color: t.muted }),
      );
    } else {
      p.elements.push(aiText(r.text, [tx, y + rh * 0.1, tw, rh * 0.8], 28 * s, t, { middle: true }));
    }
  });
}

// A picture area: the user's image, an AI picture already made, or a placeholder the AI fills in later.
function imageSlot(p, d, box, t, s) {
  const radius = 18 * s;
  if (d._imageSrc) {
    const k = Math.min(box.w / (d._imageW || box.w), box.h / (d._imageH || box.h));
    const w = (d._imageW || box.w) * k, h = (d._imageH || box.h) * k;
    p.elements.push({ id: uid(), type: "image", src: d._imageSrc, x: box.x + (box.w - w) / 2, y: box.y + (box.h - h) / 2, w, h, rotation: 0, opacity: 1, radius });
    return;
  }
  const ph = S("rect", box.x, box.y, box.w, box.h, { fill: t.soft, radius });
  const label = T("🖼️\nAdd an image from Uploads", box.x, box.y + box.h / 2 - 20 * s * 1.25, box.w, { fontSize: 20 * s, align: "center", color: t.muted });
  p.elements.push(ph, label);
  if (d.image_prompt) p.pendingImage = { ...box, radius, prompt: String(d.image_prompt), ids: [ph.id, label.id] };
}

    p.elements.push(
      aiText(d.title || "Thank you!", [W * 0.1, H * 0.3, W * 0.8, H * 0.22], 80 * s, t, { head: true, bold: true, align: "center", color: light ? t.text : t.onCover }),
      ...(st === "minimal" ? [S("rect", W / 2 - W * 0.04, H * 0.54, W * 0.08, Math.max(2, 3 * s), { fill: t.accent })] : []),
      aiText(d.subtitle, [W * 0.1, H * 0.58, W * 0.8, H * 0.15], 26 * s, t, { align: "center", color: light ? t.muted : t.onCover }),
    );
  },
};

function buildSlide(spec, themeKey = project.aiTheme, styleKey = project.aiStyle, variant = 0) {
  const t = AI_THEMES[themeKey] || AI_THEMES.blue;
  const st = AI_STYLES[styleKey] ? styleKey : "modern";
  const layout = AI_LAYOUTS[spec.layout] ? spec.layout : "bullets";
  spec = { ...spec, layout };
  const userImg = spec.image_ref && ai.images[spec.image_ref];
  if (userImg) Object.assign(spec, { _imageSrc: userImg.src, _imageW: userImg.w, _imageH: userImg.h }); // kept for later restyles
  const p = newPage(String(spec.name || spec.title || spec.question || LAYOUT_NAMES[layout]).slice(0, 60));
  p.bg = t.bg;
  p.layout = layout;
  p.spec = spec;
  p.variant = variant % VARIANTS[layout].length;
  p.notes = String(spec.notes || "");
  p.tags = strList(spec.tags, 6);
  AI_LAYOUTS[layout](p, spec, t, project.w, project.h, sc(), st, p.variant);
  p.elements = p.elements.filter(Boolean);
  return p;
}

// Fill every "contents" page with the current list of page names.
function fillContents() {
  for (const p of project.pages) {
    const el = p.contentsId && p.elements.find((e) => e.id === p.contentsId);
    if (!el) continue;
    const names = project.pages.filter((x) => x !== p && x.layout !== "cover").map((x, i) => `${i + 1}.  ${x.name}`);
    el.text = names.join("\n") || "…";
    const rtl = RTL.test(el.text);
    el.lineHeight = rtl ? 1.9 : 1.5;
    if (rtl) { el.fontFamily = "Noto Nastaliq Urdu"; el.align = "right"; }
    el.fontSize = fitSize(el.text, el.w, p.contentsH || project.h * 0.58, 26 * sc(), 10, el.fontFamily, false, el.lineHeight);
  }
}

const blobToDataURL = (blob) => new Promise((resolve) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.readAsDataURL(blob);
});

// The free image service is often busy; wait as long as it asks and try again a few times.
async function fetchAIImage(pi) {
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(pi.prompt)}?width=${Math.round(pi.w)}&height=${Math.round(pi.h)}&nologo=true`;
  for (let attempt = 0; attempt < 4; attempt++) {
    const res = await fetch(`${url}&seed=${Math.floor(Math.random() * 1e6)}`);
    if (res.ok && /^image\//.test(res.headers.get("content-type") || "")) return blobToDataURL(await res.blob());
    if (![402, 429, 503].includes(res.status)) return null;
    const m = (await res.text()).match(/retry after (\d+)/i);
    await sleep((m ? +m[1] + 1 : 15) * 1000);
  }
  return null;
}

// Swap image placeholders for free AI-generated pictures (Pollinations). Failures keep the placeholder.
async function fillImages(pageIds) {
  const jobs = project.pages.filter((p) => pageIds.includes(p.id) && p.pendingImage);
  let done = 0, failed = 0;
  for (const job of jobs) {
    const pi = job.pendingImage;
    toast(`Creating pictures… ${++done} / ${jobs.length}`);
    try {
      const src = await fetchAIImage(pi);
      if (!src) { failed++; continue; }
      const page = project.pages.find((p) => p.id === job.id); // the project may have changed meanwhile
      if (!page || !page.pendingImage) continue;
      const at = Math.max(0, page.elements.findIndex((e) => e.id === pi.ids[0]));
      page.elements = page.elements.filter((e) => !pi.ids.includes(e.id));
      page.elements.splice(at, 0, { id: uid(), type: "image", src, x: pi.x, y: pi.y, w: pi.w, h: pi.h, rotation: 0, opacity: 1, radius: pi.radius });
      if (page.spec) Object.assign(page.spec, { _imageSrc: src, _imageW: pi.w, _imageH: pi.h }); // survives restyling
      delete page.pendingImage;
      if (page === curPage()) { renderPage(); if (!selectedId) renderProps(); }
      commit();
    } catch (e) {
      failed++; // keep the placeholder
    }
  }
  if (failed) toast(`The free picture service is busy — select the slide and press “Create picture with AI” later`);
}

// ================= Start =================
(async function init() {
  loadSaved();
  // Wait briefly for the web fonts so text measures correctly (works offline too, just with fallback fonts).
  await Promise.race([
    Promise.all(FONTS.slice(0, 5).map((f) => document.fonts.load(`16px "${f}"`))).catch(() => {}),
    sleep(2500),
  ]);
  renderAll();
  lastSnap = snapshot();
  $("undoBtn").disabled = $("redoBtn").disabled = true;
  document.fonts.addEventListener("loadingdone", () => renderPage());
})();
