<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<style id="printStyle"></style>
<style>
  :root {
    --bg: #e9edf5;
    --panel: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --accent: #2f6fed;
    --border: #e3e7ef;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; color: #fff;
    background: linear-gradient(120deg, #2f6fed, #7b4dff);
  }
  .brand { font-weight: 700; font-size: 17px; margin-right: 4px; }
  .topbar a.nav {
    color: #fff; text-decoration: none; font-size: 13px;
    background: rgba(255,255,255,.15); padding: 5px 12px; border-radius: 999px;
  }
  .topbar input.title {
    background: rgba(255,255,255,.15); border: 1px solid transparent; color: #fff;
    font: inherit; font-weight: 600; padding: 5px 10px; border-radius: 8px; width: 240px;
  }
  .topbar input.title:focus { outline: none; border-color: rgba(255,255,255,.6); }
  .topbar .spacer { flex: 1; }
  .topbar button, .topbar select {
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .topbar button:hover, .topbar select:hover { background: rgba(255,255,255,.28); }
  .topbar button:disabled { opacity: .4; cursor: default; }
  .topbar select option { color: #000; }
  .topbar .primary { background: #fff; color: var(--accent); font-weight: 700; }
  .topbar .primary:hover { background: #eef2ff; }
  #saveState { font-size: 12px; opacity: .85; }

  /* ---------- Layout ---------- */
  .app { flex: 1; display: grid; grid-template-columns: 72px 250px minmax(0, 1fr) 272px; min-height: 0; }
  .rail { background: #1d2433; display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; }
  .rail button {
    background: none; border: 0; color: #cbd2e1; font: inherit; font-size: 11px; padding: 8px 2px;
    border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .rail button span { font-size: 20px; }
  .rail button.active, .rail button:hover { background: #2c3550; color: #fff; }

  .drawer { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 14px 12px; }
  .app.ai-open { grid-template-columns: 72px 360px minmax(0, 1fr) 272px; }

  /* ---------- AI assistant ---------- */
  .drawer.ai { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .ai-head { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .ai-head b { font-size: 15px; }
  .ai-head small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #chatLog { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #f1f4fa; border-bottom-left-radius: 4px; }
  .msg.error { background: #fdecea; color: #b42318; }
  .msg .note { display: block; margin-top: 6px; font-size: 11px; color: var(--accent); font-weight: 600; }
  .welcome { color: var(--muted); font-size: 13px; line-height: 1.6; background: #f8fafc; border-radius: 12px; padding: 10px 12px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 2px; }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
  .suggest button {
    background: #f3f6ff; border: 1px solid #dbe3fb; color: var(--accent); border-radius: 999px;
    padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; text-align: start;
  }
  .suggest button:hover { border-color: var(--accent); }
  .ai-input { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: flex-end; }
  .ai-input textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; }
  .ai-input button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .ai-input button:disabled { opacity: .5; cursor: default; }
  .ai-settings { border-top: 1px solid var(--border); padding: 8px 14px 10px; font-size: 13px; max-height: 45%; overflow: auto; }
  .ai-settings summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .ai-settings .f:first-of-type { margin-top: 8px; }
  .ai-input .icon { background: #f3f5fa; color: var(--text); padding: 9px 9px; border: 1px solid var(--border); }
  .ai-input .icon:hover { border-color: var(--accent); }
  .rec { background: #e11d48 !important; color: #fff !important; border-color: #e11d48 !important; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(225, 29, 72, .2); } }
  .voice-row { display: flex; gap: 8px; align-items: center; padding: 0 14px 8px; font-size: 12px; }
  .voice-row select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .attach-list { display: flex; gap: 8px; padding: 0 14px; flex-wrap: wrap; }
  .attach-list:not(:empty) { padding-top: 8px; }
  .attach-list .a { position: relative; }
  .attach-list img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .attach-list button {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0;
    background: #1d2433; color: #fff; font-size: 10px; cursor: pointer; padding: 0;
  }
  .msg-imgs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .msg-imgs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }

  /* ---------- Templates panel ---------- */
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .theme-card {
    display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
    padding: 6px; cursor: pointer; font: inherit; font-size: 12px; color: var(--text); text-align: left;
  }
  .theme-card:hover { border-color: var(--accent); }
  .theme-card.on { border-color: var(--accent); box-shadow: 0 0 0 2px #dbe5ff; }
  .theme-card .sw { width: 34px; height: 26px; border-radius: 6px; position: relative; flex: none; }
  .theme-card .sw i { position: absolute; width: 9px; height: 9px; border-radius: 50%; bottom: 3px; border: 1px solid #fff; }
  .theme-card .sw i:first-child { right: 3px; }
  .theme-card .sw i:last-child { right: 14px; }
  .style-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .style-row button { background: #f3f5fa; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--text); }
  .style-row button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; }
  .tpl-thumb { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; font-size: 11px; color: var(--muted); }
  .tpl-thumb img {
    width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 6px; border: 1px solid var(--border);
    background: #eef1f6; display: block; margin-bottom: 3px;
  }
  .tpl-thumb:hover img { border-color: var(--accent); box-shadow: 0 0 0 2px #dbe5ff; }
  .ai-settings input[type=password] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; }
  .drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }
  .drawer h3:first-child { margin-top: 0; }

  .workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .canvas-area { flex: 1; overflow: auto; display: flex; padding: 30px; min-height: 0; }
  #pageHolder { position: relative; flex: none; margin: auto; }
  #page {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    box-shadow: 0 6px 28px rgba(20, 30, 60, .18); background: #fff;
  }

  .props { background: var(--panel); border-left: 1px solid var(--border); overflow: auto; padding: 14px; }

  /* ---------- Elements on the page ---------- */
  .el { position: absolute; user-select: none; touch-action: none; cursor: move; }
  .el:hover { outline: 1px solid rgba(47, 111, 237, .55); }
  .el.text { white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.25; }
  .el[contenteditable] { cursor: text; user-select: text; outline: 2px solid rgba(47, 111, 237, .4); }
  .el img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .el.tag { display: flex; align-items: center; justify-content: center; border-radius: 999px; white-space: nowrap; font-weight: 600; }

  #selBox { position: absolute; border: 2px solid var(--accent); pointer-events: none; display: none; z-index: 5; }
  #selBox .h {
    position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--accent);
    border-radius: 50%; pointer-events: auto;
  }
  .h[data-dir=nw] { left: -7px; top: -7px; cursor: nwse-resize; }
  .h[data-dir=n]  { left: calc(50% - 6px); top: -7px; cursor: ns-resize; }
  .h[data-dir=ne] { right: -7px; top: -7px; cursor: nesw-resize; }
  .h[data-dir=e]  { right: -7px; top: calc(50% - 6px); cursor: ew-resize; }
  .h[data-dir=se] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .h[data-dir=s]  { left: calc(50% - 6px); bottom: -7px; cursor: ns-resize; }
  .h[data-dir=sw] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .h[data-dir=w]  { left: -7px; top: calc(50% - 6px); cursor: ew-resize; }
  #selBox.text .h[data-dir=n], #selBox.text .h[data-dir=s] { display: none; }
  .guide { position: absolute; background: #ec4899; display: none; z-index: 4; pointer-events: none; }
  #guideV { width: 1px; top: 0; bottom: 0; left: 50%; }
  #guideH { height: 1px; left: 0; right: 0; top: 50%; }

  /* ---------- Page strip ---------- */
  .pagebar {
    display: flex; gap: 12px; padding: 10px 14px; background: #fff; border-top: 1px solid var(--border);
    overflow-x: auto; flex: none; align-items: flex-start;
  }
  .thumb { flex: none; cursor: pointer; font-size: 11px; color: var(--muted); max-width: 160px; }
  .thumb canvas { display: block; border: 2px solid transparent; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .thumb.active canvas { border-color: var(--accent); }
  .thumb.active { color: var(--accent); font-weight: 600; }
  .thumb div { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add-page {
    flex: none; width: 96px; height: 80px; border: 2px dashed #b8c3dd; border-radius: 8px;
    background: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 13px;
  }
  .add-page:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Drawer contents ---------- */
  .tpl {
    display: block; width: 100%; text-align: left; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font: inherit;
  }
  .tpl b { display: block; font-size: 14px; }
  .tpl small { color: var(--muted); }
  .tpl:hover { border-color: var(--accent); background: #f3f6ff; }
  .tpl.pack { background: linear-gradient(120deg, #2f6fed, #7b4dff); color: #fff; border: 0; }
  .tpl.pack small { color: #e0e7ff; }
  .add-btn {
    display: block; width: 100%; text-align: left; background: #f3f5fa; border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; margin-bottom: 6px; cursor: pointer; color: var(--text);
  }
  .add-btn:hover { border-color: var(--accent); }
  .shape-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .shape-grid button {
    height: 58px; background: #f3f5fa; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--muted);
  }
  .shape-grid button:hover { border-color: var(--accent); }
  .shape-grid i { display: block; background: var(--accent); }
  .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .emoji-grid button { font-size: 22px; background: #f3f5fa; border: 1px solid transparent; border-radius: 8px; padding: 5px 0; cursor: pointer; }
  .emoji-grid button:hover { border-color: var(--accent); }
  .uploads { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .uploads .u { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 1; background: #f3f5fa; }
  .uploads img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .uploads .x {
    position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 50%;
    width: 22px; height: 22px; cursor: pointer; font-size: 12px; padding: 0;
  }
  .drop-hint { border: 2px dashed #b8c3dd; border-radius: 10px; padding: 14px; text-align: center; font-size: 13px; color: var(--muted); }
  .outline-item { padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .outline-item:hover { background: #f3f6ff; }
  .outline-item.active { background: #e8edff; font-weight: 600; }
  .mini { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .mini span { font-size: 10px; background: #eef2fa; border-radius: 999px; padding: 1px 6px; color: var(--muted); font-weight: 400; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* ---------- Form controls (drawer + properties) ---------- */
  .f { display: block; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .f > span { display: block; margin-bottom: 4px; }
  .f em { font-style: normal; color: var(--text); float: right; }
  .props input[type=text], .props input[type=number], .props select, .props textarea,
  .drawer input[type=text], .drawer select, .drawer textarea {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: 13px; background: #fff; color: var(--text);
  }
  .props textarea, .drawer textarea { resize: vertical; }
  .props textarea { margin-bottom: 10px; }
  .props input[type=range] { width: 100%; }
  input[type=color] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .toolrow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolrow button { min-width: 32px; height: 32px; background: #f3f5fa; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .toolrow button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .inline { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-grid.six { grid-template-columns: repeat(6, 1fr); }
  .btn-grid button, button.wide {
    background: #f3f5fa; border: 1px solid var(--border); border-radius: 8px; padding: 7px 4px;
    cursor: pointer; font: inherit; font-size: 12px; color: var(--text);
  }
  button.wide { width: 100%; margin-bottom: 10px; }
  .btn-grid button:hover, .toolrow button:hover, button.wide:hover { border-color: var(--accent); }
  .props-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .props-head button { background: #f3f5fa; border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; cursor: pointer; margin-left: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .swatches button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #cfd6e4; cursor: pointer; padding: 0; }
  .tip { font-size: 12px; color: var(--muted); background: #f3f6ff; border-radius: 8px; padding: 8px 10px; margin-top: 14px; line-height: 1.5; }

  .chips-input { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: #fff; }
  .chips-input .chip {
    background: #e8edff; color: var(--accent); border-radius: 999px; padding: 3px 6px 3px 10px;
    font-size: 12px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center;
  }
  .chips-input .chip b { cursor: pointer; opacity: .6; }
  .chips-input .chip b:hover { opacity: 1; }
  .chips-input input { border: 0; outline: 0; flex: 1; min-width: 90px; font: inherit; font-size: 13px; padding: 3px; }

  /* ---------- Present mode ---------- */
  #present { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; }
  #present img { max-width: 100vw; max-height: 100vh; }
  #present .bar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    color: #fff; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px; font-size: 13px;
  }
  #present .bar button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }

  .toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #1d2433; color: #fff;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; font-size: 14px;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  input[type=file] { display: none; }

  #printArea { display: none; }
  @media print {
    html, body { height: auto; overflow: visible; display: block; background: #fff; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
    #printArea img { width: 100%; display: block; break-after: page; }
    #printArea img:last-child { break-after: auto; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">🎓 Course Designer</span>
  <a class="nav" href="index.html">🖼️ Image Tool</a>
  <input class="title" id="titleInput" title="Course title" placeholder="Course title">
  <span id="saveState"></span>
  <span class="spacer"></span>
  <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
  <select id="sizeSelect" title="Page size"></select>
  <select id="zoomSelect" title="Zoom">
    <option value="fit">Fit</option>
    <option value="0.25">25%</option>
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.5">150%</option>
  </select>
  <select id="fileSelect" title="Project">
    <option value="">📁 Project</option>
    <option value="new">New project</option>
    <option value="open">Open project file…</option>
    <option value="save">Save project file (.json)</option>
  </select>
  <select id="exportSelect" title="Download">
    <option value="">⬇ Download</option>
    <option value="png">PNG — this page</option>
    <option value="png2">PNG HD (2×) — this page</option>
    <option value="jpg">JPG — this page</option>
    <option value="allpng">PNG — all pages</option>
    <option value="pdf">PDF — all pages</option>
  </select>
  <button class="primary" id="presentBtn">▶ Present</button>
  <button id="helpBtn" title="Keyboard shortcuts">?</button>
</div>

<div class="app">
  <nav class="rail" id="rail">
    <button data-drawer="ai" class="active"><span>🤖</span>AI</button>
    <button data-drawer="templates"><span>🧩</span>Templates</button>
    <button data-drawer="text"><span>🔤</span>Text</button>
    <button data-drawer="elements"><span>⬛</span>Elements</button>
    <button data-drawer="uploads"><span>⬆️</span>Uploads</button>
    <button data-drawer="course"><span>🎓</span>Course</button>
  </nav>

  <aside class="drawer" id="drawer"></aside>

  <section class="workspace">
    <div class="canvas-area" id="canvasArea">
      <div id="pageHolder">
        <div id="page"></div>
        <div id="selBox">

<script>
// ================= Helpers =================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => (s || "course").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "course";
const toHex = (c) => (/^#[0-9a-f]{6}$/i.test(c || "") ? c : "#ffffff");
const toBlob = (c, type, q) => new Promise((r) => c.toBlob(r, type, q));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ================= Constants =================
const STORAGE_KEY = "course-designer-project";
const ACCENT = "#2f6fed";
const FONTS = ["Poppins", "Montserrat", "Playfair Display", "Roboto Slab", "Pacifico", "Noto Nastaliq Urdu", "Segoe UI", "Georgia", "Courier New", "Segoe UI Emoji"];
const RTL = /[֐-ࣿ]/; // Urdu, Arabic, Hebrew…
const SIZES = [
  ["Presentation 16:9", 1280, 720],
  ["Square post", 1080, 1080],
  ["Story / Reel 9:16", 1080, 1920],
  ["A4 portrait", 794, 1123],
  ["A4 landscape / certificate", 1123, 794],
  ["Facebook / LinkedIn post", 1200, 628],
];
const THEMES = [
  ["#ffffff", null], ["#f8fafc", null], ["#fff7ed", null], ["#ecfdf5", null], ["#fdf2f8", null],
  ["#1d2433", null], ["#1e3a8a", "#7b4dff"], ["#f97316", "#ec4899"], ["#059669", "#0ea5e9"], ["#111827", "#4b5563"],
];
const EMOJIS = ["🎓", "📘", "📚", "✅", "❌", "⭐", "💡", "📌", "🎯", "🔥", "📝", "⏱️", "🏆", "👉", "🚀", "💬", "❓", "⚠️", "📈", "🎉"];
const TYPE_NAMES = { text: "Text", rect: "Shape", ellipse: "Circle", image: "Image", tag: "Tag" };

// ================= Element factories =================
const measureCtx = document.createElement("canvas").getContext("2d");

function tagWidth(text, size, family) {
  measureCtx.font = `600 ${size}px "${family}"`;
  return Math.round(measureCtx.measureText(text).width + size * 1.6);
}

function T(text, x, y, w, o = {}) {
  const fontSize = Math.round(o.fontSize || 32);
  return {
    id: uid(), type: "text", text, x, y, w, h: text.split("\n").length * fontSize * 1.25,
    rotation: 0, opacity: 1, fontFamily: "Poppins", color: "#1d2433", bold: false, italic: false,
    underline: false, align: "left", fill: "transparent", ...o, fontSize,
  };
}

function S(type, x, y, w, h, o = {}) {
  return { id: uid(), type, x, y, w, h, rotation: 0, opacity: 1, fill: ACCENT, stroke: "#1d2433", strokeWidth: 0, radius: 0, ...o };
}

function TAG(text, x, y, o = {}) {
  const fontSize = Math.round(o.fontSize || 20);
  const fontFamily = o.fontFamily || "Poppins";
  return {
    id: uid(), type: "tag", text, x, y, w: tagWidth(text, fontSize, fontFamily), h: Math.round(fontSize * 2),
    rotation: 0, opacity: 1, fontFamily, fill: "#e8edff", color: ACCENT, ...o, fontSize,
  };
}

function tagRow(tags, x, y, o = {}) {
  const out = [];
  for (const t of tags) {
    const el = TAG(t, x, y, o);
    out.push(el);
    x += el.w + 12;
  }
  return out;
}

function newPage(name) {
  return { id: uid(), name, bg: "#ffffff", bgGradient: null, bgImage: null, tags: [], elements: [] };
}

// Templates are laid out for 1280×720 and scaled to the current page size.
const sc = () => Math.min(project.w / 1280, project.h / 720);

// Example content for each layout — used by the Templates panel and the course pack.
const SAMPLES = {
  cover: () => ({ title: project.title, subtitle: project.description || "A short promise of what your students will be able to do.", tags: project.tags.slice(0, 4) }),
  contents: () => ({ title: "Course contents" }),
  section: () => ({ kicker: "Lesson 1", title: "Lesson title goes here", subtitle: "In this lesson you will learn the key idea, see an example and practise it yourself." }),
  bullets: () => ({ title: "Topic heading", bullets: ["Explain the first idea simply", "Show a real example", "Share a quick tip", "Point out a common mistake"] }),
  bullets_image: () => ({ title: "Topic with a picture", bullets: ["Explain the idea in one line", "Add a real-life example", "Finish with a tip"] }),
  two_column: () => ({ title: "Compare two ideas", left: { heading: "Before", bullets: ["Slow and manual", "Easy to make mistakes"] }, right: { heading: "After", bullets: ["Fast and simple", "Clear steps to follow"] } }),
  keypoints: () => ({ title: "Key points", points: [{ title: "Understand", text: "Learn the core idea in simple words." }, { title: "Practise", text: "Try it with a guided example." }, { title: "Apply", text: "Use it in your own project." }] }),
  stats: () => ({ title: "By the numbers", stats: [{ value: "12", label: "short video lessons" }, { value: "30 min", label: "practice each week" }, { value: "1", label: "certificate at the end" }] }),
  quote: () => ({ quote: "The expert in anything was once a beginner.", author: "Helen Hayes" }),
  quiz: () => ({ name: "Quiz", question: "Which of these is the correct answer?", options: ["Option one", "Option two", "Option three", "Option four"], answer: 0 }),
  summary: () => ({ title: "Summary", bullets: ["The main idea of this lesson", "The steps you practised", "How to use it in real work"] }),
  certificate: () => ({ name: "Certificate" }),
  thanks: () => ({ title: "Thank you!", subtitle: "Questions? hello@yourcourse.com" }),
};
const sampleSpec = (layout) => ({ layout, ...SAMPLES[layout]() });
const COURSE_PACK = ["cover", "contents", "section", "bullets", "bullets_image", "keypoints", "stats", "quiz", "summary", "certificate", "thanks"];

// ================= State =================
let project;
let pageIndex = 0;
let selectedId = null;
let zoom = 1;
let zoomMode = "fit";
let drawerTab = "ai";
let clipboard = null;
const undoStack = [];
const redoStack = [];
let lastSnap = null;

const curPage = () => project.pages[pageIndex];
const selectedEl = () => curPage().elements.find((e) => e.id === selectedId) || null;
const findEl = (id) => curPage().elements.find((e) => e.id === id);
const nodeOf = (el) => $("page").querySelector(`[data-id="${el.id}"]`);

function defaultProject() {
  project = {
    title: "My Course", description: "", category: "", level: "Beginner",
    tags: ["Design", "Beginner"], w: 1280, h: 720, pages: [], uploads: [],
  };
  project.aiTheme = "blue";
  project.aiStyle = "modern";
  project.pages.push(buildSlide(sampleSpec("cover")));
  pageIndex = 0;
}

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.pages) && saved.pages.length) project = saved;
  } catch (e) { /* storage unavailable or corrupt — start fresh */ }
  if (!project) defaultProject();
  project.uploads = project.uploads || [];
  project.tags = project.tags || [];
}

// ================= Undo / redo / autosave =================
const snapshot = () => JSON.stringify({ project, pageIndex });

function commit() {
  const s = snapshot();
  if (s === lastSnap) return;
  if (lastSnap) undoStack.push(lastSnap);
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  lastSnap = s;
  afterChange();
}

let commitTimer;
function scheduleCommit() {
  clearTimeout(commitTimer);
  commitTimer = setTimeout(commit, 400);
}

function undo() {
  clearTimeout(commitTimer);
  commit(); // keep any pending change
  if (!undoStack.length) return;
  redoStack.push(lastSnap);
  lastSnap = undoStack.pop();
  restore(lastSnap);
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(lastSnap);
  lastSnap = redoStack.pop();
  restore(lastSnap);
}

function restore(s) {
  const o = JSON.parse(s);
  // Stay on the current page unless pages were added or removed.
  if (o.project.pages.length !== project.pages.length) pageIndex = o.pageIndex;
  project = o.project;
  pageIndex = clamp(pageIndex, 0, project.pages.length - 1);
  selectedId = null;
  renderAll();
  afterChange();
}

function afterChange() {
  $("undoBtn").disabled = !undoStack.length;
  $("redoBtn").disabled = !redoStack.length;
  save();
  refreshThumbs();
  if (drawerTab === "course" && !$("drawer").contains(document.activeElement)) renderDrawer();
}

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  $("saveState").textContent = "Saving…";
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
      $("saveState").textContent = "✓ Saved in this browser";
    } catch (e) {
      $("saveState").textContent = /quota/i.test(e.name)
        ? "⚠ Too big to autosave — use Project → Save project file"
        : "⚠ Autosave unavailable here — use Project → Save project file";
    }
  }, 400);
}

// ================= Rendering the page =================
function bgCss(p) {
  let s = p.bgGradient ? `linear-gradient(135deg, ${p.bg}, ${p.bgGradient})` : p.bg;
  if (p.bgImage) s = `url("${p.bgImage}") center / cover no-repeat, ${s}`;
  return s;
}

function applyPageBg() {
  $("page").style.background = bgCss(curPage());
}

function renderPage() {
  const pg = $("page");
  pg.style.width = project.w + "px";
  pg.style.height = project.h + "px";
  applyPageBg();
  pg.replaceChildren();
  for (const el of curPage().elements) {
    const n = document.createElement("div");
    n.dataset.id = el.id;
    pg.appendChild(n);
    styleNode(n, el);
  }
  applyZoom();
}

function updateNode(el) {
  const n = nodeOf(el);
  if (n) styleNode(n, el);
}

function styleNode(n, el) {
  Object.assign(n.style, {
    left: el.x + "px", top: el.y + "px", width: el.w + "px",
    height: el.type === "text" ? "auto" : el.h + "px",
    opacity: el.opacity,
    transform: el.rotation ? `rotate(${el.rotation}deg)` : "",
  });
  switch (el.type) {
    case "text":
      n.className = "el text";
      n.dir = "auto";
      if (!n.isContentEditable) n.textContent = el.text;
      Object.assign(n.style, {
        lineHeight: el.lineHeight || 1.25,
        fontFamily: `"${el.fontFamily}"`, fontSize: el.fontSize + "px", color: el.color,
        fontWeight: el.bold ? 700 : 400, fontStyle: el.italic ? "italic" : "normal",
        textDecoration: el.underline ? "underline" : "none", textAlign: el.align, background: el.fill,
      });
      el.h = n.offsetHeight || el.h; // text grows with its content
      break;
    case "rect":
    case "ellipse":
      n.className = "el";
      Object.assign(n.style, {
        background: el.fill, boxSizing: "border-box",
        border: el.strokeWidth ? `${el.strokeWidth}px solid ${el.stroke}` : "none",
        borderRadius: el.type === "ellipse" ? "50%" : el.radius + "px",
      });
      break;
    case "image": {
      n.className = "el";
      let img = n.querySelector("img");
      if (!img) { img = document.createElement("img"); img.draggable = false; n.appendChild(img); }
      if (img.getAttribute("src") !== el.src) img.src = el.src;
      Object.assign(n.style, { borderRadius: el.radius + "px", overflow: "hidden" });
      break;
    }
    case "tag":
      n.className = "el tag";
      n.dir = "auto";
      if (!n.isContentEditable) n.textContent = el.text;
      Object.assign(n.style, { background: el.fill, color: el.color, fontFamily: `"${el.fontFamily}"`, fontSize: el.fontSize + "px" });
      break;
  }
}

function fitZoom() {
  const a = $("canvasArea");
  return clamp(Math.min((a.clientWidth - 60) / project.w, (a.clientHeight - 60) / project.h), 0.05, 2);
}

function applyZoom() {
  zoom = zoomMode === "fit" ? fitZoom() : +zoomMode;
  $("page").style.transform = `scale(${zoom})`;
  $("pageHolder").style.width = project.w * zoom + "px";
  $("pageHolder").style.height = project.h * zoom + "px";
  updateSelection();
}

function updateSelection() {
  const box = $("selBox");
  const el = selectedEl();
  if (!el) { box.style.display = "none"; return; }
  box.className = el.type === "text" ? "text" : "";
  Object.assign(box.style, {
    display: "block",
    left: el.x * zoom - 1 + "px", top: el.y * zoom - 1 + "px",
    width: el.w * zoom + 2 + "px", height: el.h * zoom + 2 + "px",
    transform: el.rotation ? `rotate(${el.rotation}deg)` : "",
  });
}

function select(id) {
  selectedId = id;
  updateSelection();
  renderProps();
}

function renderAll() {
  $("titleInput").value = project.title;
  buildSizeSelect();
  renderPage();
  renderProps();
  renderDrawer();
  refreshThumbs();
}

// ================= Drawing a page to a canvas (export, thumbnails, present) =================
const imgCache = {};
const getImg = (src) => (imgCache[src] = imgCache[src] || loadImage(src));

function roundRectPath(x, X, Y, W, H, R) {
  R = Math.max(0, Math.min(R, W / 2, H / 2));
  x.beginPath();
  x.moveTo(X + R, Y);
  x.arcTo(X + W, Y, X + W, Y + H, R);
  x.arcTo(X + W, Y + H, X, Y + H, R);
  x.arcTo(X, Y + H, X, Y, R);
  x.arcTo(X, Y, X + W, Y, R);
  x.closePath();
}

function wrapLines(x, text, maxW) {
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const word of para.split(" ")) {
      const test = line ? line + " " + word : word;
      if (line && x.measureText(test).width > maxW) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}

async function drawEl(x, el) {
  const { w, h } = el;
  switch (el.type) {
    case "rect":
    case "ellipse": {
      const sw = el.strokeWidth || 0;
      const path = (inset) => {
        if (el.type === "ellipse") {
          x.beginPath();
          x.ellipse(w / 2, h / 2, Math.max(0, w / 2 - inset), Math.max(0, h / 2 - inset), 0, 0, Math.PI * 2);
        } else roundRectPath(x, inset, inset, w - 2 * inset, h - 2 * inset, el.radius - inset);
      };
      if (el.fill !== "transparent") { path(0); x.fillStyle = el.fill; x.fill(); }
      if (sw) { path(sw / 2); x.lineWidth = sw; x.strokeStyle = el.stroke; x.stroke(); }
      break;
    }
    case "image": {
      const img = await getImg(el.src);
      roundRectPath(x, 0, 0, w, h, el.radius);
      x.clip();
      x.drawImage(img, 0, 0, w, h);
      break;
    }
    case "text": {
      if (el.fill !== "transparent") { x.fillStyle = el.fill; x.fillRect(0, 0, w, h); }
      x.font = `${el.italic ? "italic " : ""}${el.bold ? 700 : 400} ${el.fontSize}px "${el.fontFamily}"`;
      x.fillStyle = el.color;
      x.textBaseline = "middle";
      x.textAlign = el.align;
      const rtl = RTL.test(el.text);
      x.direction = rtl ? "rtl" : "ltr";
      const lh = el.fontSize * (el.lineHeight || 1.25);
      const ax = el.align === "center" ? w / 2 : el.align === "right" ? w : 0;
      wrapLines(x, el.text, w).forEach((line, i) => {
        const y = i * lh + lh / 2;
        // A right-to-left mark keeps leading bullets/numbers on the right, like the editor shows them.
        x.fillText(rtl ? "‏" + line : line, ax, y);
        if (el.underline) {
          const tw = x.measureText(line).width;
          const sx = el.align === "center" ? ax - tw / 2 : el.align === "right" ? ax - tw : ax;
          x.fillRect(sx, y + el.fontSize * 0.42, tw, Math.max(1, el.fontSize / 16));
        }
      });
      break;
    }
    case "tag":
      roundRectPath(x, 0, 0, w, h, h / 2);
      x.fillStyle = el.fill;
      x.fill();
      x.font = `600 ${el.fontSize}px "${el.fontFamily}"`;
      x.fillStyle = el.color;
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.direction = RTL.test(el.text) ? "rtl" : "ltr";
      x.fillText(el.text, w / 2, h / 2);
      break;
  }
}

async function renderToCanvas(page, scale = 1) {
  await document.fonts.ready;
  const W = project.w, H = project.h;
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(W * scale));
  c.height = Math.max(1, Math.round(H * scale));
  const x = c.getContext("2d");
  x.scale(scale, scale);

  if (page.bgGradient) {
    // Same geometry as CSS linear-gradient(135deg, …).
    const a = (135 * Math.PI) / 180, dx = Math.sin(a), dy = -Math.cos(a);
    const len = Math.abs(W * dx) + Math.abs(H * dy);
    const g = x.createLinearGradient(W / 2 - (dx * len) / 2, H / 2 - (dy * len) / 2, W / 2 + (dx * len) / 2, H / 2 + (dy * len) / 2);
    g.addColorStop(0, page.bg);
    g.addColorStop(1, page.bgGradient);
    x.fillStyle = g;
  } else x.fillStyle = page.bg;
  x.fillRect(0, 0, W, H);

  if (page.bgImage) {
    const img = await getImg(page.bgImage);
    const s = Math.max(W / img.width, H / img.height);
    x.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s);
  }

  for (const el of page.elements) {
    x.save();
    x.globalAlpha = el.opacity;
    x.translate(el.x + el.w / 2, el.y + el.h / 2);
    if (el.rotation) x.rotate((el.rotation * Math.PI) / 180);
    x.translate(-el.w / 2, -el.h / 2);
    await drawEl(x, el);
    x.restore();
  }
  return c;
}

// ================= Page strip =================
let thumbTimer;
function refreshThumbs() {
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(drawThumbs, 250);
}

async function drawThumbs() {
  const scale = Math.min(150 / project.w, 90 / project.h);
  const items = [];
  for (const [i, p] of project.pages.entries()) {
    const d = document.createElement("div");
    d.className = "thumb" + (i === pageIndex ? " active" : "");
    d.title = p.name;
    d.appendChild(await renderToCanvas(p, scale));
    const label = document.createElement("div");
    label.textContent = `${i + 1}. ${p.name}`;
    d.appendChild(label);
    d.addEventListener("click", () => goPage(i));
    items.push(d);
  }
  const add = document.createElement("button");
  add.className = "add-page";
  add.textContent = "+ Add page";
  add.addEventListener("click", () => addPage(newPage(`Page ${project.pages.length + 1}`)));
  $("pages").replaceChildren(...items, add);
}

function goPage(i) {
  if (i === pageIndex) return;
  pageIndex = clamp(i, 0, project.pages.length - 1);
  selectedId = null;
  renderAll();
}

function addPage(page) {
  project.pages.splice(pageIndex + 1, 0, page);
  pageIndex++;
  selectedId = null;
  renderAll();
  commit();
}

// ================= Mouse: select, move, resize =================
let drag = null;

$("page").addEventListener("pointerdown", (e) => {
  const node = e.target.closest(".el");
  if (document.activeElement?.isContentEditable && document.activeElement !== node) document.activeElement.blur();
  if (node?.isContentEditable) return;
  if (!node) { select(null); return; }
  const el = findEl(node.dataset.id);
  if (!el) return;
  if (selectedId !== el.id) select(el.id);
  startDrag(e, el, "move");
});

$("canvasArea").addEventListener("pointerdown", (e) => {
  if (e.target === $("canvasArea") || e.target === $("pageHolder")) {
    document.activeElement?.isContentEditable && document.activeElement.blur();
    select(null);
  }
});

$("selBox").addEventListener("pointerdown", (e) => {
  const h = e.target.closest(".h");
  if (!h || !selectedEl()) return;
  e.stopPropagation();
  startDrag(e, selectedEl(), h.dataset.dir);
});

function startDrag(e, el, mode) {
  e.preventDefault();
  drag = { mode, el, sx: e.clientX, sy: e.clientY, start: { x: el.x, y: el.y, w: el.w, h: el.h, fontSize: el.fontSize }, moved: false };
  window.addEventListener("pointermove", onDrag);
  window.addEventListener("pointerup", endDrag, { once: true });
}

function onDrag(e) {
  const d = drag, el = d.el, s = d.start;
  const dx = (e.clientX - d.sx) / zoom, dy = (e.clientY - d.sy) / zoom;
  if (!d.moved && Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) < 3) return;
  d.moved = true;

  if (d.mode === "move") {
    let x = s.x + dx, y = s.y + dy;
    const snap = 6 / zoom;
    const onV = Math.abs(x + el.w / 2 - project.w / 2) < snap;
    const onH = Math.abs(y + el.h / 2 - project.h / 2) < snap;
    if (onV) x = project.w / 2 - el.w / 2;
    if (onH) y = project.h / 2 - el.h / 2;
    el.x = Math.round(x);
    el.y = Math.round(y);
    showGuides(onV, onH);
  } else {
    const dir = d.mode;
    let { x, y, w, h } = s;
    if (dir.includes("e")) w = s.w + dx;
    if (dir.includes("w")) w = s.w - dx;
    if (dir.includes("s")) h = s.h + dy;
    if (dir.includes("n")) h = s.h - dy;
    w = Math.max(10, w);
    h = Math.max(10, h);
    const corner = dir.length === 2;
    // Images and tags keep their shape when dragged by a corner (hold Shift for any element).
    if (corner && (el.type === "image" || el.type === "tag" || e.shiftKey)) {
      const r = s.w / s.h;
      if (w / h > r) h = w / r; else w = h * r;
    }
    if (dir.includes("w")) x = s.x + s.w - w;
    if (dir.includes("n")) y = s.y + s.h - h;
    if ((el.type === "text" || el.type === "tag") && corner) el.fontSize = Math.max(6, Math.round((s.fontSize * w) / s.w));
    Object.assign(el, { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
  }
  updateNode(el);
  updateSelection();
}

function endDrag() {
  window.removeEventListener("pointermove", onDrag);
  showGuides(false, false);
  if (drag?.moved) { commit(); renderProps(); }
  drag = null;
}

function showGuides(v, h) {
  $("guideV").style.display = v ? "block" : "none";
  $("guideH").style.display = h ? "block" : "none";
}

// Double-click text or a tag to type in it.
$("page").addEventListener("dblclick", (e) => {
  const node = e.target.closest(".el");
  const el = node && findEl(node.dataset.id);
  if (el && (el.type === "text" || el.type === "tag")) editText(node, el);
});

function editText(node, el) {
  node.contentEditable = "plaintext-only";
  node.focus();
  document.getSelection().selectAllChildren(node);
  node.oninput = () => {
    el.h = node.offsetHeight;
    updateSelection();
  };
  node.onblur = () => {
    node.removeAttribute("contenteditable");
    node.oninput = node.onblur = null;
    el.text = node.innerText.replace(/\n$/, "");
    if (el.type === "tag") { el.w = tagWidth(el.text, el.fontSize, el.fontFamily); el.h = Math.round(el.fontSize * 2); }
    updateNode(el);
    updateSelection();
    commit();
    renderProps();
  };
}

// ================= Adding things =================
function place(el) {
  const shift = (curPage().elements.length % 5) * 16;
  el.x = Math.round((project.w - el.w) / 2 + shift);
  el.y = Math.round((project.h - el.h) / 2 + shift);
  curPage().elements.push(el);
  renderPage();
  select(el.id);
  commit();
}

function addElement(kind) {
  const W = project.w, s = sc();
  const make = {
    heading: () => T("Add a heading", 0, 0, W * 0.7, { fontSize: 56 * s, bold: true, fontFamily: "Montserrat" }),
    subheading: () => T("Add a subheading", 0, 0, W * 0.6, { fontSize: 34 * s, bold: true, color: "#475467" }),
    body: () => T("Add a little bit of body text. Double-click to edit.", 0, 0, W * 0.5, { fontSize: 22 * s, color: "#344054" }),
    bullets: () => T("• First point\n• Second point\n• Third point", 0, 0, W * 0.45, { fontSize: 24 * s }),
    numbered: () => T("1. First step\n2. Second step\n3. Third step", 0, 0, W * 0.45, { fontSize: 24 * s }),
    quote: () => T("“A great quote goes here.”\n— Author", 0, 0, W * 0.6, { fontSize: 32 * s, italic: true, fontFamily: "Playfair Display", align: "center" }),
    rect: () => S("rect", 0, 0, W * 0.2, W * 0.12),
    rounded: () => S("rect", 0, 0, W * 0.2, W * 0.12, { radius: 24 * s }),

}

function addEmoji(emoji) {
  const size = Math.round(90 * sc());
  place(T(emoji, 0, 0, size * 1.4, { fontSize: size, align: "center", fontFamily: "Segoe UI Emoji" }));
}

function addFontPair(headFont, bodyFont) {
  const W = project.w, H = project.h, s = sc();
  const head = T("Your heading here", W * 0.15, H * 0.32, W * 0.7, { fontSize: 54 * s, bold: true, fontFamily: headFont, align: "center" });
  const body = T("And a supporting line of text underneath it.", W * 0.2, H * 0.32 + head.h + 16 * s, W * 0.6, { fontSize: 24 * s, fontFamily: bodyFont, align: "center", color: "#475467" });
  curPage().elements.push(head, body);
  renderPage();
  select(head.id);
  commit();
}

// Shrink big photos so the project stays small enough to autosave.
async function readImageFile(file) {
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  URL.revokeObjectURL(url);
  const m = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * m);
  c.height = Math.round(img.naturalHeight * m);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const keepAlpha = /png|webp|gif|svg/.test(file.type);
  return { src: c.toDataURL(keepAlpha ? "image/png" : "image/jpeg", 0.86), w: c.width, h: c.height };
}

function addImage(u) {
  const s = Math.min((project.w * 0.5) / u.w, (project.h * 0.6) / u.h, 1);
  place({ id: uid(), type: "image", src: u.src, x: 0, y: 0, w: Math.round(u.w * s), h: Math.round(u.h * s), rotation: 0, opacity: 1, radius: 0 });
}

async function uploadFiles(files, addToPage) {
  const images = files.filter((f) => f.type.startsWith("image/"));
  if (!images.length) return;
  for (const f of images) {
    const u = await readImageFile(f);
    project.uploads.push(u);
    if (addToPage) addImage(u);
  }
  if (drawerTab === "uploads") renderDrawer();
  commit();
}

$("uploadInput").addEventListener("change", (e) => { uploadFiles([...e.target.files], true); e.target.value = ""; });
$("bgInput").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  curPage().bgImage = (await readImageFile(f)).src;
  applyPageBg();
  renderProps();
  commit();
});
$("canvasArea").addEventListener("dragover", (e) => e.preventDefault());
$("canvasArea").addEventListener("drop", (e) => { e.preventDefault(); uploadFiles([...e.dataTransfer.files], true); });
document.addEventListener("paste", (e) => {
  if (document.activeElement?.isContentEditable || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const file = [...e.clipboardData.items].find((i) => i.type.startsWith("image/"))?.getAsFile();
  if (file) uploadFiles([file], true);
});

// ================= Actions =================
function alignEl(el, where) {
  const W = project.w, H = project.h;
  if (where === "left") el.x = 0;
  if (where === "hcenter") el.x = Math.round((W - el.w) / 2);
  if (where === "right") el.x = W - el.w;
  if (where === "top") el.y = 0;
  if (where === "vcenter") el.y = Math.round((H - el.h) / 2);
  if (where === "bottom") el.y = H - el.h;
}

function doAction(a) {
  const p = curPage();
  const el = selectedEl();
  const i = el ? p.elements.indexOf(el) : -1;
  const els = p.elements;

  switch (a) {
    case "duplicate": {
      if (!el) return;
      const c = { ...JSON.parse(JSON.stringify(el)), id: uid(), x: el.x + 20, y: el.y + 20 };
      els.splice(i + 1, 0, c);
      renderPage();
      select(c.id);
      break;
    }
    case "delete":
      if (!el) return;
      els.splice(i, 1);
      renderPage();
      select(null);
      break;
    case "front": els.splice(i, 1); els.push(el); renderPage(); break;
    case "back": els.splice(i, 1); els.unshift(el); renderPage(); break;
    case "forward": if (i < els.length - 1) [els[i], els[i + 1]] = [els[i + 1], els[i]]; renderPage(); break;
    case "backward": if (i > 0) [els[i], els[i - 1]] = [els[i - 1], els[i]]; renderPage(); break;
    case "setBg":
      p.bgImage = el.src;
      els.splice(i, 1);
      renderPage();
      select(null);
      break;
    case "dupPage": {
      const c = JSON.parse(JSON.stringify(p));
      c.id = uid();
      c.name = p.name + " (copy)";
      c.elements.forEach((e) => (e.id = uid()));
      addPage(c);
      return;
    }
    case "delPage":
      if (project.pages.length === 1) { toast("A course needs at least one page"); return; }
      if (!confirm(`Delete the page "${p.name}"?`)) return;
      project.pages.splice(pageIndex, 1);
      pageIndex = Math.min(pageIndex, project.pages.length - 1);
      selectedId = null;
      renderAll();
      break;
    case "pageLeft":
    case "pageRight": {
      const j = pageIndex + (a === "pageLeft" ? -1 : 1);
      if (j < 0 || j >= project.pages.length) return;
      [project.pages[pageIndex], project.pages[j]] = [project.pages[j], project.pages[pageIndex]];
      pageIndex = j;
      renderAll();
      break;
    }
    case "bgImage": $("bgInput").click(); return;
    case "aiImage": fillImages([p.id]); return;
    case "clearBg": p.bgImage = null; applyPageBg(); renderProps(); break;
    case "upload": $("uploadInput").click(); return;
    case "insertTags": {
      if (!project.tags.length) { toast("Add some course tags first"); return; }
      const row = tagRow(project.tags, 0, 0, { fontSize: 20 * sc() });
      const total = row.reduce((sum, t) => sum + t.w + 12, -12);
      let x = Math.max(0, (project.w - total) / 2);
      for (const t of row) { t.x = Math.round(x); t.y = Math.round(project.h * 0.86); x += t.w + 12; }
      els.push(...row);
      renderPage();
      select(row[0].id);
      break;
    }
    case "coursePack": {
      const pages = COURSE_PACK.map((layout, i) => buildSlide(sampleSpec(layout), project.aiTheme, project.aiStyle, i));
      project.pages.splice(pageIndex + 1, 0, ...pages);
      pageIndex += 1;
      selectedId = null;
      fillContents();
      renderAll();
      toast(`Added ${COURSE_PACK.length} pages — edit any of them`);
      break;
    }
    case "shuffle": {
      project.pages[pageIndex] = rebuildPage(p, (p.variant || 0) + 1);
      fillContents();
      selectedId = null;
      renderAll();
      break;
    }
    default:
      return;
  }
  commit();
}

// ================= Keyboard =================
document.addEventListener("keydown", (e) => {
  if (!$("present").classList.contains("hidden")) {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); stepSlide(1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); stepSlide(-1); }
    if (e.key === "Escape") stopPresent();
    return;
  }
  const ae = document.activeElement;
  const typing = ae && (ae.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(ae.tagName));
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (typing) {
    if (e.key === "Escape" && ae.isContentEditable) ae.blur();
    return;
  }
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === "y") { e.preventDefault(); redo(); return; }
  if (mod && k === "v" && clipboard) {
    e.preventDefault();
    const c = JSON.parse(clipboard);
    c.id = uid();
    c.x += 20;
    c.y += 20;
    clipboard = JSON.stringify(c);
    curPage().elements.push(c);
    renderPage();
    select(c.id);
    commit();
    return;
  }
  const el = selectedEl();
  if (!el) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); doAction("delete"); }
  else if (mod && k === "d") { e.preventDefault(); doAction("duplicate"); }
  else if (mod && k === "c") { clipboard = JSON.stringify(el); toast("Copied — press Ctrl+V to paste"); }
  else if (e.key.startsWith("Arrow")) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    if (e.key === "ArrowLeft") el.x -= step;
    if (e.key === "ArrowRight") el.x += step;
    if (e.key === "ArrowUp") el.y -= step;
    if (e.key === "ArrowDown") el.y += step;
    updateNode(el);
    updateSelection();
    scheduleCommit();
  } else if (e.key === "Escape") select(null);
  else if (e.key === "Enter" && (el.type === "text" || el.type === "tag")) { e.preventDefault(); editText(nodeOf(el), el); }
});

// ================= Properties panel (right) =================
const field = (label, input) => `<label class="f"><span>${label}</span>${input}</label>`;

function renderProps() {
  const P = $("props");
  const el = selectedEl();
  if (!el) { renderPageProps(); return; }
  const isText = el.type === "text" || el.type === "tag";
  let h = `<div class="props-head"><b>${TYPE_NAMES[el.type]}</b><span>
    <button data-action="duplicate" title="Duplicate (Ctrl+D)">⧉</button><button data-action="delete" title="Delete (Del)">🗑</button></span></div>`;

  if (isText) {
    h += `<textarea data-prop="text" rows="3" dir="auto">${esc(el.text)}</textarea>
      <button class="wide" data-dictate="1">🎤 Type by voice</button>`;
    h += `<div class="two">${field("Font", `<select data-prop="fontFamily">${FONTS.map((f) => `<option ${f === el.fontFamily ? "selected" : ""}>${f}</option>`).join("")}</select>`)}
      ${field("Size", `<input type="number" min="6" max="400" data-prop="fontSize" value="${el.fontSize}">`)}</div>`;
    h += `<div class="toolrow"><input type="color" data-prop="color" value="${toHex(el.color)}" title="Text colour">`;
    if (el.type === "text") {
      h += `<button data-toggle="bold" class="${el.bold ? "on" : ""}" title="Bold"><b>B</b></button>
        <button data-toggle="italic" class="${el.italic ? "on" : ""}" title="Italic"><i>I</i></button>
        <button data-toggle="underline" class="${el.underline ? "on" : ""}" title="Underline"><u>U</u></button>
        ${[["left", "⫷"], ["center", "≡"], ["right", "⫸"]].map(([a, icon]) =>
          `<button data-set="align" data-value="${a}" class="${el.align === a ? "on" : ""}" title="Align ${a}">${icon}</button>`).join("")}`;
    }
    h += `</div>`;
  }
  if (el.type !== "image") {
    const none = el.fill === "transparent";
    h += field(el.type === "text" ? "Highlight behind text" : "Fill colour", `<div class="toolrow" style="margin:0">
      <input type="color" data-prop="fill" value="${toHex(el.fill)}">
      ${el.type !== "tag" ? `<label class="inline"><input type="checkbox" data-prop="fillNone" ${none ? "checked" : ""}> None</label>` : ""}</div>`);
  }
  if (el.type === "rect" || el.type === "ellipse") {
    h += `<div class="two">${field("Border colour", `<input type="color" data-prop="stroke" value="${toHex(el.stroke)}">`)}
      ${field("Border width", `<input type="number" min="0" max="100" data-prop="strokeWidth" value="${el.strokeWidth}">`)}</div>`;
  }
  if (el.type === "rect" || el.type === "image") {
    h += field(`Rounded corners <em>${el.radius}</em>`, `<input type="range" min="0" max="${Math.round(Math.min(el.w, el.h) / 2)}" data-prop="radius" value="${el.radius}">`);
  }
  if (el.type === "image") h += `<button class="wide" data-action="setBg">Use as page background</button>`;

  h += `<div class="sub">Position &amp; size</div><div class="four">${["x", "y", "w", "h"].map((k) =>
    field(k.toUpperCase(), `<input type="number" data-prop="${k}" value="${Math.round(el[k])}" ${k === "h" && isText ? "disabled" : ""}>`)).join("")}</div>`;
  h += field(`Rotation <em>${el.rotation}°</em>`, `<input type="range" min="-180" max="180" data-prop="rotation" value="${el.rotation}">`);
  h += field(`Opacity <em>${Math.round(el.opacity * 100)}%</em>`, `<input type="range" min="5" max="100" data-prop="opacity" data-scale="100" value="${Math.round(el.opacity * 100)}">`);
  h += `<div class="sub">Layer</div><div class="btn-grid">
    <button data-action="front">⤒ To front</button><button data-action="back">⤓ To back</button>
    <button data-action="forward">↑ Forward</button><button data-action="backward">↓ Backward</button></div>`;
  h += `<div class="sub">Align on page</div><div class="btn-grid six">
    ${[["left", "⇤"], ["hcenter", "↔"], ["right", "⇥"], ["top", "⤒"], ["vcenter", "↕"], ["bottom", "⤓"]]
      .map(([a, icon]) => `<button data-align="${a}" title="${a}">${icon}</button>`).join("")}</div>`;
  P.innerHTML = h;
}

function renderPageProps() {
  const p = curPage();
  $("props").innerHTML = `<div class="props-head"><b>Page ${pageIndex + 1} of ${project.pages.length}</b></div>
    ${field("Page / lesson name", `<input type="text" data-page-prop="name" value="${esc(p.name)}">`)}
    <div class="two">
      ${field("Background", `<input type="color" data-page-prop="bg" value="${toHex(p.bg)}">`)}
      ${field("Gradient", `<div class="toolrow" style="margin:0"><input type="color" data-page-prop="bgGradient" value="${toHex(p.bgGradient || p.bg)}">
        <label class="inline"><input type="checkbox" data-page-prop="gradOn" ${p.bgGradient ? "checked" : ""}> On</label></div>`)}
    </div>
    <div class="swatches">${THEMES.map(([a, b], i) =>
      `<button data-theme="${i}" style="background:${b ? `linear-gradient(135deg,${a},${b})` : a}" title="Background"></button>`).join("")}</div>
    ${p.spec && VARIANTS[p.layout]?.length > 1 ? `<button class="wide" data-action="shuffle">🔀 Shuffle design (${VARIANTS[p.layout].length} layouts)</button>` : ""}
    ${p.pendingImage ? `<button class="wide" data-action="aiImage">🖼️ Create picture with AI</button>` : ""}
    ${field("Background image", `<div class="toolrow" style="margin:0"><button class="wide" style="margin:0;flex:1" data-action="bgImage">Choose image…</button>
      ${p.bgImage ? `<button class="wide" style="margin:0;flex:1" data-action="clearBg">Remove</button>` : ""}</div>`)}
    <label class="f"><span>Page tags</span></label><div class="chips-input" id="pageTags"></div>
    <div style="height:10px"></div>
    ${field("Speaker notes", `<textarea data-page-prop="notes" rows="3" dir="auto" placeholder="Notes for when you present">${esc(p.notes || "")}</textarea>`)}
    <div class="sub">Page</div>
    <div class="btn-grid">
      <button data-action="dupPage">⧉ Duplicate</button><button data-action="delPage">🗑 Delete</button>
      <button data-action="pageLeft">← Move earlier</button><button data-action="pageRight">Move later →</button>
    </div>
    <p class="tip">Click anything on the page to edit it. Double-click text to type.
      Drag images from your computer straight onto the page.</p>`;
  chipInput($("pageTags"), p.tags, commit);

$("props").addEventListener("input", (e) => {
  const t = e.target;
  const pageProp = t.dataset.pageProp;
  if (pageProp) {
    const p = curPage();
    if (pageProp === "gradOn") p.bgGradient = t.checked ? $("props").querySelector('[data-page-prop="bgGradient"]').value : null;
    else if (pageProp === "bgGradient") {
      p.bgGradient = t.value;
      $("props").querySelector('[data-page-prop="gradOn"]').checked = true;
    } else p[pageProp] = t.value;
    applyPageBg();
    scheduleCommit();
    return;
  }

  const prop = t.dataset.prop;
  const el = selectedEl();
  if (!prop || !el) return;
  let v = t.type === "checkbox" ? t.checked : t.type === "number" || t.type === "range" ? +t.value / (+t.dataset.scale || 1) : t.value;
  if (t.type === "number" && (t.value === "" || isNaN(v))) return;

  if (prop === "fillNone") el.fill = v ? "transparent" : $("props").querySelector('[data-prop="fill"]').value;
  else {
    el[prop] = v;
    const noneBox = $("props").querySelector('[data-prop="fillNone"]');
    if (prop === "fill" && noneBox) noneBox.checked = false;
  }
  if (el.type === "tag" && ["text", "fontSize", "fontFamily"].includes(prop)) {
    el.w = tagWidth(el.text, el.fontSize, el.fontFamily);
    el.h = Math.round(el.fontSize * 2);
  }
  const em = t.closest("label")?.querySelector("em");
  if (em) em.textContent = prop === "rotation" ? v + "°" : prop === "opacity" ? t.value + "%" : t.value;
  updateNode(el);
  updateSelection();
  scheduleCommit();
});

$("props").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.dictate) { toggleMic($("props").querySelector('[data-prop="text"]'), b); return; }
  if (b.dataset.action) { doAction(b.dataset.action); return; }
  if (b.dataset.theme) {
    const [bg, grad] = THEMES[+b.dataset.theme];
    Object.assign(curPage(), { bg, bgGradient: grad });
    applyPageBg();
    renderProps();
    commit();
    return;
  }
  const el = selectedEl();
  if (!el) return;
  if (b.dataset.toggle) el[b.dataset.toggle] = !el[b.dataset.toggle];
  else if (b.dataset.set) el[b.dataset.set] = b.dataset.value;
  else if (b.dataset.align) alignEl(el, b.dataset.align);
  else return;
  updateNode(el);
  updateSelection();
  renderProps();
  commit();
});

// A tag box: type and press Enter (or comma) to add, click × to remove.
function chipInput(container, list, onChange) {
  const input = document.createElement("input");
  input.placeholder = "Type a tag + Enter";
  const render = () => {
    container.querySelectorAll(".chip").forEach((c) => c.remove());
    list.forEach((tag, i) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = `${esc(tag)} <b title="Remove">×</b>`;
      chip.querySelector("b").addEventListener("click", () => { list.splice(i, 1); render(); onChange(); });
      container.insertBefore(chip, input);
    });
  };
  input.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === ",") && input.value.trim()) {
      e.preventDefault();
      for (const t of input.value.split(",").map((s) => s.trim()).filter(Boolean)) if (!list.includes(t)) list.push(t);
      input.value = "";
      render();
      onChange();
    } else if (e.key === "Backspace" && !input.value && list.length) {
      list.pop();
      render();
      onChange();
    }
  });
  container.replaceChildren(input);
  container.addEventListener("click", () => input.focus());
  render();
}

function renderDrawer() {
  const isAI = drawerTab === "ai";
  const app = document.querySelector(".app");
  const widthChanged = app.classList.contains("ai-open") !== isAI;
  const draft = $("chatInput")?.value;
  $("drawer").classList.toggle("ai", isAI);
  app.classList.toggle("ai-open", isAI);
  $("drawer").innerHTML = DRAWERS[drawerTab]();
  document.querySelectorAll("#rail button").forEach((b) => b.classList.toggle("active", b.dataset.drawer === drawerTab));
  if (drawerTab === "course") chipInput($("courseTags"), project.tags, commit);
  if (isAI) {
    if (draft) $("chatInput").value = draft;
    $("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat($("chatInput").value); }
    });
    $("chatInput").addEventListener("paste", (e) => {
      const file = [...e.clipboardData.items].find((i) => i.type.startsWith("image/"))?.getAsFile();
      if (file) { e.preventDefault(); attachImages([file]); }
    });
    renderChat();
    renderAttachments();
  }
  if (drawerTab === "templates") drawPreviews();
  if (widthChanged) applyZoom();
}

// Small pictures of each layout in the current theme/style for the Templates panel (cached).
const previewCache = {};
async function drawPreviews() {
  const look = `${project.aiTheme}|${project.aiStyle}|${project.w}x${project.h}|${project.title}`;
  for (const img of $("drawer").querySelectorAll("img[data-preview]")) {
    const key = look + "|" + img.dataset.preview;
    if (!previewCache[key]) {
      const [layout, v] = img.dataset.preview.split(":");
      const page = buildSlide(sampleSpec(layout), project.aiTheme, project.aiStyle, +v);
      previewCache[key] = (await renderToCanvas(page, 220 / project.w)).toDataURL("image/jpeg", 0.85);
    }
    if (img.isConnected) img.src = previewCache[key];
  }
}

    downloadBlob(await toBlob(c, type, 0.92), `${name}-page-${pageIndex + 1}.${v === "jpg" ? "jpg" : "png"}`);

    }

});

// The browser's print dialog has "Save as PDF"; each page becomes one PDF page.
async function exportPdf() {
  toast("Preparing pages… choose “Save as PDF” in the print window");
  const imgs = [];
  for (const p of project.pages) {
    const img = new Image();
    img.src = (await renderToCanvas(p, 2)).toDataURL("image/jpeg", 0.92);
    imgs.push(img);
  }
  await Promise.all(imgs.map((i) => i.decode()));
  $("printArea").replaceChildren(...imgs);
  $("printStyle").textContent = `@page { size: ${project.w}px ${project.h}px; margin: 0; }`;
  window.print();
}

$("presentBtn").addEventListener("click", async () => {
  toast("Preparing slides…");
  const scale = Math.min(2, Math.max(1, screen.width / project.w));
  show.slides = [];
  for (const p of project.pages) show.slides.push((await renderToCanvas(p, scale)).toDataURL("image/jpeg", 0.92));
  show.i = pageIndex;
  $("present").classList.remove("hidden");
  showSlide();
  try { await $("present").requestFullscreen(); } catch (e) { /* full screen not allowed — the overlay still works */ }
});

function showSlide() {
  $("slideImg").src = show.slides[show.i];
  $("slideCount").textContent = `${show.i + 1} / ${show.slides.length}`;
}

function stepSlide(d) {
  show.i = clamp(show.i + d, 0, show.slides.length - 1);
  showSlide();
}

function stopPresent() {
  $("present").classList.add("hidden");
  if (document.fullscreenElement) document.exitFullscreen();
}

$("slideImg").addEventListener("click", () => stepSlide(1));
$("prevSlide").addEventListener("click", () => stepSlide(-1));

const AI_SYSTEM_PROMPT = `You are the AI design assistant inside "Course Designer", a slide and online-course builder (similar to Gamma).
You create and edit course presentations by returning slide specs; the app turns them into designed pages with its own layouts, themes and styles.

ALWAYS answer with ONE JSON object and nothing else (no markdown, no code fences):

Layouts and their fields:

Rules:

const ai = { messages: [], busy: false, status: "", settings: loadAISettings(), images: {}, pending: [], imageCount: 0 };

I'll plan the slides, write the content and design them with this app's themes and layouts — then you can edit anything by hand.

اردو، हिंदी یا English — جس زبان میں چاہیں لکھیں یا بولیں۔</div>`;

  }${esc(m.content)}${m.note ? `<span class="note">✓ ${esc(m.note)}</span>` : ""}</div>`).join("");

function renderAttachments() {
  const box = $("attachList");
  if (!box) return;
  box.innerHTML = ai.pending.map((id) =>
    `<span class="a"><img src="${ai.images[id].src}" alt="" title="${esc(ai.images[id].name)}"><button data-unattach="${id}" title="Remove">✕</button></span>`).join("");
}

async function attachImages(files) {
  for (const f of files.filter((f) => f.type.startsWith("image/"))) {
    const u = await readImageFile(f);
    // A smaller copy is what gets sent to the AI, so requests stay fast.
    const img = await loadImage(u.src);
    const m = Math.min(1, 1024 / Math.max(u.w, u.h));
    const c = document.createElement("canvas");
    c.width = Math.round(u.w * m);
    c.height = Math.round(u.h * m);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const id = "img" + ++ai.imageCount;
    ai.images[id] = { ...u, name: f.name || id, visionSrc: c.toDataURL("image/jpeg", 0.82) };
    ai.pending.push(id);
    project.uploads.push(u);
  }
  renderAttachments();
  commit();
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

function toggleMic(target, btn, onDone) {
  if (!SpeechRec) { toast("Voice typing works in Google Chrome or Microsoft Edge"); return; }
  if (recognition) { recognition.stop(); return; }
  recognition = new SpeechRec();
  recognition.lang = ai.settings.voiceLang || "ur-PK";
  recognition.interimResults = true;
  const before = target.value ? target.value.replace(/\s*$/, " ") : "";
  recognition.onresult = (e) => {
    target.value = before + [...e.results].map((r) => r[0].transcript).join("");
    target.dispatchEvent(new Event("input", { bubbles: true }));
  };
  recognition.onerror = (e) => {
    toast(e.error === "not-allowed" ? "Microphone access was blocked — allow it in the browser's address bar" :
      e.error === "no-speech" ? "Didn't hear anything — try again" : "Voice typing error: " + e.error);
  };
  recognition.onend = () => {
    recognition = null;
    btn.classList.remove("rec");
    onDone?.();
  };
  btn.classList.add("rec");
  recognition.start();
  toast("Listening… speak now");
}

// ---------- Talking to the AI ----------
async function sendChat(text) {
  text = (text || "").trim();
  if (ai.busy || (!text && !ai.pending.length)) return;
  ai.messages.push({ role: "user", content: text || "(picture)", images: ai.pending.splice(0) });
  ai.busy = true;
  ai.status = "AI is working";
  if ($("chatInput")) $("chatInput").value = "";
  renderAttachments();
  renderChat();
  try {
    const data = await callAI();
    const note = await applyAI(data);
    ai.messages.push({ role: "assistant", content: String(data.reply || note || "Done."), note });
  } catch (err) {
    ai.messages.push({ role: "assistant", content: "⚠️ " + err.message, error: true });
  }
  ai.busy = false;
  renderChat();
}

// What the AI can "see": the course details and the text on every page.
